<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 608px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
.post {
  width: 1080px; height: 608px;
  background: #f8f9fa; display: flex; position: relative; overflow: hidden;
}
.left {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  padding: 50px 40px 50px 60px;
}
.badge {
  display: inline-block; padding: 6px 16px; border-radius: 16px;
  background: rgba(0,230,91,0.1); font-size: 12px; font-weight: 600;
  color: #00E65B; letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 20px; width: fit-content;
}
h1 {
  font-size: 36px; font-weight: 800; color: #202124; line-height: 1.2;
  margin-bottom: 12px;
}
p {
  font-size: 16px; color: #5f6368; line-height: 1.5; margin-bottom: 24px;
}
.features { display: flex; flex-direction: column; gap: 10px; }
.feat {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; color: #3c4043;
}
.feat .check {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(0,230,91,0.1); display: flex; align-items: center;
  justify-content: center; font-size: 12px; flex-shrink: 0; color: #00E65B;
}
.right {
  width: 460px; background: linear-gradient(135deg, #1F2133 0%, #0d3b66 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.right::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 40% 40%, rgba(0,230,91,0.12) 0%, transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(0,102,255,0.1) 0%, transparent 50%);
}
.right-content {
  position: relative; z-index: 1; text-align: center; padding: 40px;
}
.right-content .logo {
  font-size: 48px; font-weight: 800; color: #fff; letter-spacing: 4px;
}
.right-content .sub {
  font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 2px;
  margin-top: 8px;
}
.accent-line {
  width: 80px; height: 3px; margin: 16px auto 0;
  background: linear-gradient(90deg, #00E65B, #0066FF);
  border-radius: 2px;
}
.bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, #00E65B, #0066FF, #6E00FF);
}
</style></head><body>
<div class="post">
  <div class="left">
    <div class="badge">Consultoria Digital</div>
    <h1>APSIDE</h1>
    <p>Consultoria de marketing digital para negócios locais em Ponta Grossa e região.</p>
    <div class="features">
      <div class="feat"><div class="check">✓</div> Google Meu Negócio otimizado</div>
      <div class="feat"><div class="check">✓</div> Sites e landing pages</div>
      <div class="feat"><div class="check">✓</div> SEO local e tráfego pago</div>
    </div>
  </div>
  <div class="right">
    <div class="right-content">
      <div class="logo">APSIDE</div>
      <div class="sub">MARKETING DIGITAL</div>
      <div class="accent-line"></div>
    </div>
  </div>
  <div class="bar"></div>
</div>
</body></html>
