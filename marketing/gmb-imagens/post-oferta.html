<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 900px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
.post {
  width: 1200px; height: 900px;
  background: #f8f9fa; display: flex; position: relative; overflow: hidden;
}
.left {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  padding: 60px 50px 60px 70px;
}
.badge {
  display: inline-block; padding: 6px 16px; border-radius: 16px;
  background: rgba(0,230,91,0.1); font-size: 13px; font-weight: 600;
  color: #00E65B; letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 24px; width: fit-content;
}
h1 {
  font-size: 42px; font-weight: 800; color: #202124; line-height: 1.2;
  margin-bottom: 16px;
}
p {
  font-size: 18px; color: #5f6368; line-height: 1.6; margin-bottom: 30px;
}
.features { display: flex; flex-direction: column; gap: 12px; }
.feat {
  display: flex; align-items: center; gap: 12px;
  font-size: 15px; color: #3c4043;
}
.feat .check {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,230,91,0.1); display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex-shrink: 0; color: #00E65B;
}
.right {
  width: 550px; background: linear-gradient(135deg, #1F2133 0%, #0d3b66 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.right::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 40% 40%, rgba(0,230,91,0.12) 0%, transparent 50%),
    radial-gradient(circle at 70% 70%, rgba(0,102,255,0.1) 0%, transparent 50%);
}
.mockup {
  position: relative; z-index: 1;
  width: 400px; background: #fff;
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.mockup-phone {
  width: 260px; height: 460px; background: #1a1a1a;
  border-radius: 28px; padding: 12px; margin: 0 auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.mockup-screen {
  width: 100%; height: 100%; background: #fff;
  border-radius: 18px; overflow: hidden; position: relative;
}
.mockup-header {
  height: 80px; background: linear-gradient(135deg, #1F2133, #0d3b66);
  display: flex; align-items: center; justify-content: center;
}
.mockup-header span { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 2px; }
.mockup-body { padding: 16px; }
.mockup-line { height: 8px; border-radius: 4px; background: #e8eaed; margin-bottom: 8px; }
.mockup-line.short { width: 60%; }
.mockup-line.accent { background: linear-gradient(90deg, #00E65B, #0066FF); height: 24px; width: 120px; border-radius: 6px; margin-top: 12px; }
.mockup-stars { color: #fbbc04; font-size: 14px; margin: 12px 0 8px; }
.mockup-rev { height: 6px; border-radius: 3px; background: #f1f3f4; margin-bottom: 6px; }
.mockup-rev.w60 { width: 60%; }
.mockup-rev.w80 { width: 80%; }
.bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, #00E65B, #0066FF, #6E00FF);
}
</style></head><body>
<div class="post">
  <div class="left">
    <div class="badge">Diagnóstico Gratuito</div>
    <h1>Seu negócio não aparece no Google?</h1>
    <p>Analizamos seu Google Meu Negócio e mostramos exatamente o que falta pra ser encontrado.</p>
    <div class="features">
      <div class="feat"><div class="check">✓</div> Análise completa do perfil</div>
      <div class="feat"><div class="check">✓</div> Identificação de problemas</div>
      <div class="feat"><div class="check">✓</div> Plano de ação personalizado</div>
    </div>
  </div>
  <div class="right">
    <div class="mockup-phone">
      <div class="mockup-screen">
        <div class="mockup-header"><span>APSIDE</span></div>
        <div class="mockup-body">
          <div class="mockup-line short"></div>
          <div class="mockup-line"></div>
          <div class="mockup-line"></div>
          <div class="mockup-stars">★★★★★</div>
          <div class="mockup-rev w80"></div>
          <div class="mockup-rev w60"></div>
          <div class="mockup-line accent"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="bar"></div>
</div>
</body></html>
