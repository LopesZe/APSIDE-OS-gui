<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     STORY / REEL BASE — APSIDE (1080x1920, 9:16, paleta v3.1)
     Mesmo padrão do carrossel. Correção tranquila: edite as
     5 variáveis em :root. Para story de DADO, descomente
     .numeral e use texto curto. Ver identidade/design-guide.md.
     ============================================================ */
  :root {
    --fundo-escuro: #000000;
    --fundo-claro:  #E7E6EF;
    --regua: #4130D8;            /* régua/barras — nos dois fundos */
    --destaque-escuro: #6E5CFF;  /* palavra/numeral no escuro (4,6:1) */
    --destaque-claro:  #4130D8;  /* palavra/numeral no claro */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .slide {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    text-align: left; padding: 120px;
  }
  .slide > * { position: relative; z-index: 1; }
  .dark { background: var(--fundo-escuro); color: #E7E6EF; --destaque: var(--destaque-escuro); }
  .light { background: var(--fundo-claro); color: #000000; --destaque: var(--destaque-claro); }
  /* Exceção única de gradiente: fade #2F2399 subindo do rodapé (só no escuro) */
  .dark::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
    background: linear-gradient(to top, rgba(47,35,153,0.55), rgba(47,35,153,0));
    z-index: 0; pointer-events: none;
  }
  .counter { position: absolute; top: 90px; right: 120px; font-size: 18px; font-family: 'DM Sans', sans-serif; font-weight: 600; letter-spacing: 0.18em; opacity: 0.7; z-index: 2; }
  .logo-top { position: absolute; top: 84px; left: 120px; width: 170px; opacity: 0.95; z-index: 2; }
  .handle { position: absolute; bottom: 96px; left: 120px; font-size: 26px; font-family: 'DM Sans', sans-serif; font-weight: 600; z-index: 2; }
  .topic {
    color: var(--destaque); font-family: 'DM Sans', sans-serif; font-weight: 600;
    font-size: 30px; letter-spacing: 0.02em; margin-bottom: 28px; text-transform: none;
  }
  h2 {
    font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 88px;
    line-height: 1.06; letter-spacing: -0.03em; max-width: 840px;
  }
  .hl { color: var(--destaque); }
  .rule { width: 64px; height: 6px; background: var(--regua); margin: 40px 0; border-radius: 9999px; }
  .light p { color: #2F2399; }
  .dark p { color: rgba(231,230,239,0.78); }
  p { font-size: 34px; font-weight: 400; line-height: 1.5; max-width: 820px; }
  .hint {
    margin-top: 48px; font-size: 26px; font-family: 'DM Sans', sans-serif;
    font-weight: 600; color: var(--destaque); letter-spacing: 0.02em;
  }
  /* Descomente para story de DADO (número gigante):
  .numeral { font-family: 'DM Sans', sans-serif; font-size: 340px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: var(--destaque); margin-bottom: 16px; }
  */
</style>
</head>
<body>

<!-- STORY (escuro) — frase de impacto -->
<div class="slide dark">
  <img class="logo-top" src="../../../identidade/logo-apside.svg" alt="APSIDE">
  <div class="counter">STORY</div>
  <div class="topic">TÓPICO</div>
  <!-- Para DADO: <div class="numeral">90%</div><h2>texto curto</h2> -->
  <h2>Frase de impacto com <span class="hl">destaque</span> na marca.</h2>
  <div class="rule"></div>
  <p>Apoio ou contexto curto, se necessário.</p>
  <div class="hint">Assiste até o fim →</div>
  <div class="handle">@apside</div>
</div>

</body>
</html>
