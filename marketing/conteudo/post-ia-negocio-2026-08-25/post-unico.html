<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo-escuro: #1F2133;
    --fundo-claro:  #FFFFFF;
    --acento-escuro: #00E65B;
    --acento-claro:  #0066FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .slide {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    text-align: left; padding: 90px;
  }
  .dark { background: var(--fundo-escuro); color: #FFFFFF; --accent: var(--acento-escuro); }
  .light { background: var(--fundo-claro); color: #0F172A; --accent: var(--acento-claro); }
  .counter { position: absolute; top: 74px; right: 90px; font-size: 16px; font-weight: 600; letter-spacing: 0.18em; opacity: 0.7; }
  .logo-top { position: absolute; top: 70px; left: 90px; width: 160px; opacity: 0.95; }
  .icon { position: absolute; bottom: 70px; right: 90px; width: 90px; opacity: 0.95; }
  .handle { position: absolute; bottom: 76px; left: 90px; font-size: 22px; font-weight: 600; }
  .topic {
    color: var(--accent); font-weight: 600; font-size: 24px; letter-spacing: 0.02em;
    margin-bottom: 20px; text-transform: none;
  }
  h2 {
    font-weight: 800; font-size: 72px; line-height: 1.08; letter-spacing: -0.03em;
    max-width: 880px;
  }
  .hl { color: var(--accent); }
  .rule { width: 56px; height: 5px; background: var(--accent); margin: 30px 0; border-radius: 9999px; }
  .light p { color: #475569; }
  .dark p { color: #cbd5e1; }
  p { font-size: 28px; font-weight: 400; line-height: 1.55; max-width: 820px; }
</style>
</head>
<body>

<!-- POST ÚNICO (escuro) — frase de impacto -->
<div class="slide dark">
  <img class="logo-top" src="../../../identidade/LOGO%20FUNDO%20ESCURO.png" alt="APSIDE">
  <div class="counter">POST</div>
  <div class="topic">IA no negócio</div>
  <h2>IA não é pra gigante. É pra quem tá no <span class="hl">sufoco</span>.</h2>
  <div class="rule"></div>
  <p>PME que usa IA trabalha menos e vende mais — sem precisar contratar ninguém.</p>
  <img class="icon" src="../../../identidade/ICONE%20FUNDO%20ESCURO.png" alt="APSIDE">
  <div class="handle">@apside</div>
</div>

</body>
</html>
