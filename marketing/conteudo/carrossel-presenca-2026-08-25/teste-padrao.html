<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .slide {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif; background: #1F2133; color: #FFFFFF;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    text-align: left; padding: 90px;
  }
  .counter { position: absolute; top: 74px; right: 90px; font-size: 16px; font-weight: 600; letter-spacing: 0.18em; opacity: 0.7; }
  .logo-top { position: absolute; top: 70px; left: 90px; width: 160px; opacity: 0.95; }
  .icon { position: absolute; bottom: 70px; right: 90px; width: 90px; opacity: 0.95; }
  .handle { position: absolute; bottom: 76px; left: 90px; font-size: 22px; font-weight: 600; }
  .topic {
    color: #00e676; font-weight: 600; font-size: 24px; letter-spacing: 0.02em;
    margin-bottom: 20px; text-transform: none;
  }
  h2 {
    font-weight: 800; font-size: 64px; line-height: 1.1; letter-spacing: -0.025em;
    color: #FFFFFF; max-width: 880px;
  }
  .hl { color: #00e676; }
  .rule { width: 56px; height: 5px; background: #00e676; margin: 30px 0; border-radius: 9999px; }
  p {
    color: #cbd5e1; font-size: 24px; font-weight: 400; line-height: 1.6;
    max-width: 820px;
  }
</style>
</head>
<body>
<div class="slide">
  <img class="logo-top" src="../../../identidade/LOGO%20FUNDO%20ESCURO.png" alt="APSIDE">
  <div class="counter">03 / 07</div>
  <div class="topic">03 — Concorrência</div>
  <h2>Seu concorrente já está no <span class="hl">bolso</span> do cliente</h2>
  <div class="rule"></div>
  <p>Enquanto você espera o telefone tocar, ele já está sendo achado no Instagram e no Google. Todo dia. Na frente de quem está com a carteira aberta.</p>
  <img class="icon" src="../../../identidade/ICONE%20FUNDO%20ESCURO.png" alt="APSIDE">
  <div class="handle">@apside</div>
</div>
</body>
</html>
